version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: samuha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hailsuzan
      POSTGRES_PASSWORD: Suz26srs77
      POSTGRES_DB: samuha
      POSTGRES_INITDB_ARGS: "-E UTF8"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - samuha_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hailsuzan -d samuha"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  samuha_postgres_data:
    driver: local